name: docker-images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract replay image metadata
        id: replay-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/rlcoach-replay
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract gateway image metadata
        id: gateway-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/rlcoach-gateway
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push replay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.replay
          push: true
          tags: ${{ steps.replay-meta.outputs.tags }}
          labels: ${{ steps.replay-meta.outputs.labels }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gateway
          push: true
          tags: ${{ steps.gateway-meta.outputs.tags }}
          labels: ${{ steps.gateway-meta.outputs.labels }}
